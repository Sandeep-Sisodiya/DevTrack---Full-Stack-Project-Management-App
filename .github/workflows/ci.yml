# DevTrack CI Pipeline
# Runs on every push and pull request
# Tests backend, builds Docker image, and analyzes Flutter code

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Test the Node.js backend
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install backend dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Step 4: Run automated tests
      # Tests use an in-memory MongoDB, so no database setup is needed
      - name: Run tests
        working-directory: backend
        run: npm test

  # ──────────────────────────────────────────────
  # Job 2: Build the Docker image
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend-test  # Only build if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the Docker image to verify it works
      # We don't push it here — that happens in the CD pipeline
      - name: Build Docker image
        run: docker build -t devtrack-api:test ./backend

  # ──────────────────────────────────────────────
  # Job 3: Analyze and test the Flutter app
  # ──────────────────────────────────────────────
  flutter-test:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Install Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      # Step 2: Install Flutter dependencies
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # Step 3: Run static analysis to catch code issues
      - name: Run flutter analyze
        working-directory: mobile
        run: flutter analyze

      # Step 4: Run unit and widget tests
      - name: Run flutter test
        working-directory: mobile
        run: flutter test
