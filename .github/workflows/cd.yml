# DevTrack CD Pipeline
# Builds and tags a Docker image when code is merged to main
# The image can be pushed to Docker Hub or any container registry

name: CD

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Build, tag, and (optionally) push Docker image
  # ──────────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the production Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t devtrack-api:latest \
            -t devtrack-api:${{ github.sha }} \
            ./backend

      # ──────────────────────────────────────────
      # DEPLOYMENT STEP (currently commented out)
      #
      # To push to Docker Hub:
      # 1. Create a Docker Hub account at https://hub.docker.com
      # 2. Add these secrets in your GitHub repo settings:
      #    - DOCKERHUB_USERNAME: your Docker Hub username
      #    - DOCKERHUB_TOKEN: your Docker Hub access token
      # 3. Uncomment the steps below
      #
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Push to Docker Hub
      #   run: |
      #     docker tag devtrack-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/devtrack-api:latest
      #     docker tag devtrack-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/devtrack-api:${{ github.sha }}
      #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/devtrack-api:latest
      #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/devtrack-api:${{ github.sha }}
      #
      # After pushing, you can deploy to any cloud platform:
      # - AWS ECS / Fargate
      # - Google Cloud Run
      # - Azure Container Instances
      # - DigitalOcean App Platform
      # - Railway / Render
      # ──────────────────────────────────────────

      - name: Deployment summary
        run: |
          echo "✅ Docker image built successfully"
          echo "📦 Tags: devtrack-api:latest, devtrack-api:${{ github.sha }}"
          echo ""
          echo "To deploy:"
          echo "1. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"
          echo "2. Uncomment the push steps in this workflow"
          echo "3. Push to main to trigger deployment"
